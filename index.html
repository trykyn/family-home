<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F8FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리집">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리집 한눈에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 우리집 한눈에 — 집에 세워 둔 패드(가로 고정)용 가족 대시보드 (구글 홈 화면처럼 한 화면에 다 보이게).
   위: 시계·날짜·날씨 / 아래 카드: 가족 일정 · 캘린더 · 할 일 · 식단 · 장보기 · 아이들 스티커.
   자료는 우리가족·주간식단·장보기 앱이 함께 쓰는 가족 문서(households/{코드})와 우리가족 캘린더 서버에서 읽음.
   3×2 카드를 화면 하나에 딱 맞추고 넘치는 줄은 "+N개 더"로 접음. 밝은 화면만 (다크 모드·밤 화면 없음). */
:root {
  --bg: #F3F8FC;
  --surface: #FFFFFF;
  --ink: #12324A;
  --muted: #5A7689;
  --faint: #8BA3B4;
  --line: #DCEAF4;
  --sky-soft: #E4F3FF;
  --blue: #6AAFE6;
  --deep: #2F7FC1;
  --late: #C8423A;
  --ok: #2E9D5A;
  --c-plan: #6AAFE6; --c-cal: #F08A5D; --c-todo: #4CBE8C; --c-meal: #F2B33D; --c-shop: #9B7BE0; --c-kids: #FF7AA2;
  --shadow: 0 1px 0 rgba(30,110,170,.05), 0 14px 30px -22px rgba(30,110,170,.55);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --gap: 14px;
  color-scheme: light;
}
/* 앱 고정: 두 번 터치·두 손가락으로 확대되지 않게, 길게 눌러도 글자 선택·메뉴가 안 뜨게, 화면이 튕기지 않게 */
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
html, body { overscroll-behavior: none; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; }
.muted { color: var(--muted); }

#app {
  min-height: 100dvh; display: flex; flex-direction: column; gap: var(--gap);
  padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
}

/* ── 위: 시계 · 날씨 ── */
#top { display: flex; align-items: stretch; gap: var(--gap); flex-wrap: wrap; }
.clockbox { flex: 0 1 auto; min-width: 0; padding: 4px 6px; display: flex; flex-direction: column; justify-content: center; }
.clock { font: 400 clamp(64px, 8vw, 96px)/0.95 var(--font-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.date-line { font: 400 clamp(20px, 2.3vw, 27px)/1.2 var(--font-display); color: var(--muted); margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 14px; padding: 3px 10px; border-radius: 99px; background: var(--sky-soft); color: var(--deep); font-weight: 500; }
.weather {
  flex: 1.35 1 0; min-width: 0; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; isolation: isolate;
  background: #D2F0FF; border-radius: 22px; box-shadow: var(--shadow); padding: 6px 22px 6px 16px;
}
.weather > :not(.scene) { position: relative; z-index: 2; }
.w-panel { display: flex; align-items: center; gap: 16px; flex: none; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,.5); border: 1.5px solid rgba(255,255,255,.75); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.w-now { display: flex; flex-direction: column; align-items: center; flex: none; }
.w-now .row { display: flex; align-items: center; gap: 6px; }
.w-ic { font-size: 58px; line-height: 1; }
.w-temp { font: 400 56px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.w-desc { font-size: 13px; color: var(--ink); font-weight: 500; margin-top: 2px; }
.w-hilo { display: flex; flex-direction: column; gap: 8px; font: 400 28px/1 var(--font-display); flex: none; }
.w-hilo div { display: flex; align-items: center; gap: 8px; }
.w-hilo svg { width: 20px; height: 20px; }
.w-hilo .hi { color: #E2553F; }
.w-hilo .lo { color: #2F7FC1; }
.w-umb { display: flex; flex-direction: column; align-items: center; flex: none; }
.w-umb .e { font-size: 44px; line-height: 1.05; transform-origin: 50% 90%; animation: swing 2.2s ease-in-out infinite; }
.w-umb b { font: 400 15px/1 var(--font-display); color: var(--deep); }
.w-kid { margin-left: auto; align-self: flex-end; display: flex; align-items: flex-end; gap: 0; flex: none; position: relative; } /* 네 식구 발끝을 한 줄에 */
.w-kid .kid-fig + .kid-fig { margin-left: -34px; }
.w-kid { padding-right: 10px; }
.kid-fig { overflow: visible; }
/* 네 식구가 들어가도록 날씨 숫자 칸을 조금 작게 */
.w-panel { gap: 12px; padding: 8px 12px; }
.w-ic { font-size: 46px; }
.w-temp { font-size: 46px; }
.w-hilo { font-size: 23px; gap: 6px; }
.w-hilo svg { width: 16px; height: 16px; }
.w-umb .e { font-size: 36px; }
.w-umb b { font-size: 13px; }
.w-kid .kid-fig { animation: none; }
.w-kid .kid-fig.dad { height: 150px; }
.w-kid .kid-fig.mom { height: 138px; }
.w-kid .kid-fig { height: 116px; }
.w-kid .kid-fig.girl { height: 104px; }
.kid-fig { height: 146px; width: auto; display: block; cursor: pointer; animation: bob 3.2s ease-in-out infinite; }
.kid-fig.wiggle { animation: wiggle .6s ease-in-out; }
.w-when { position: absolute; top: 4px; right: 0; font: 400 15px/1 var(--font-display); padding: 5px 10px; border-radius: 99px; background: #FFF1B8; color: #8A6A00; }
.w-empty { color: var(--muted); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes swing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
/* 배경 풍경 */
.scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.scene .land { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
.scene .sun { position: absolute; left: 58%; top: 12px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(#FFE27A 55%, #FFC928 56%); box-shadow: 0 0 0 10px rgba(255,214,79,.25), 0 0 40px rgba(255,200,40,.6); animation: glow 4s ease-in-out infinite; }
.scene .moon { position: absolute; left: 58%; top: 14px; width: 42px; height: 42px; border-radius: 50%; box-shadow: -11px 6px 0 0 #FFF3C4; transform: rotate(-20deg); }
.scene .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
.scene .cloud { position: absolute; opacity: .95; animation: drift ease-in-out infinite alternate; }
.scene .cloud svg { width: 100%; display: block; }
.scene .rd { position: absolute; top: -30px; width: 2px; border-radius: 2px; background: linear-gradient(rgba(255,255,255,0), rgba(225,240,255,.95)); animation: rain linear infinite; }
.scene .sf { position: absolute; top: -12px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px rgba(120,150,180,.6); animation: snow linear infinite; }
.scene .splash { transform-box: fill-box; transform-origin: center; animation: splash 1.2s ease-out infinite; }
.scene .fogband { position: absolute; left: -20%; width: 140%; height: 46px; border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(10px); animation: fog 18s ease-in-out infinite alternate; }
.scene .flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: flash 6s linear infinite; }
.scene .bolt { position: absolute; left: 54%; top: 6px; width: 30px; opacity: 0; animation: flash 6s linear infinite; }
.scene .leaf { position: absolute; top: -24px; font-size: 20px; font-style: normal; animation: leaf linear infinite; }
.scene .fly { position: absolute; font-size: 20px; font-style: normal; animation: fly 7s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 8px rgba(255,214,79,.25), 0 0 34px rgba(255,200,40,.55); } 50% { box-shadow: 0 0 0 16px rgba(255,214,79,.18), 0 0 50px rgba(255,200,40,.7); } }
@keyframes twinkle { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
@keyframes rain { from { transform: translate(0, 0) rotate(12deg); } to { transform: translate(-46px, 240px) rotate(12deg); } }
@keyframes snow { 0% { transform: translate(0, 0); } 25% { transform: translate(10px, 55px); } 50% { transform: translate(-6px, 110px); } 75% { transform: translate(8px, 165px); } 100% { transform: translate(-4px, 225px); } }
@keyframes splash { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
@keyframes fog { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
@keyframes flash { 0%, 88%, 92%, 95%, 100% { opacity: 0; } 89%, 93% { opacity: .75; } }
@keyframes leaf { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(30px, 110px) rotate(200deg); } 100% { transform: translate(-10px, 230px) rotate(400deg); } }
@keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(-8deg); } 25% { transform: translate(40px, -18px) rotate(8deg); } 50% { transform: translate(80px, 6px) rotate(-6deg); } 75% { transform: translate(36px, 16px) rotate(6deg); } }
.tools { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.tool {
  width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 19px;
  background: var(--surface); box-shadow: var(--shadow);
}
.tool.on { background: var(--deep); color: #fff; }
.tool.lang { font-size: 13px; font-weight: 700; letter-spacing: .02em; }

/* ── 카드 ── */
#grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
.card {
  background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  padding: 14px 16px 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.c-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex: none; }
.c-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; background: color-mix(in srgb, var(--cc) 22%, transparent); flex: none; }
.c-title { font: 400 21px/1.2 var(--font-display); }
.c-sub { color: var(--muted); font-size: 14px; }
.day-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
.day-nav button { width: 34px; height: 34px; border-radius: 50%; background: var(--sky-soft); color: var(--deep); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.day-nav button:active { transform: scale(.92); }
.day-nav .back { width: auto; padding: 0 10px; border-radius: 99px; font: 600 13px/1 var(--font-body); background: #FFF1B8; color: #8A6A00; }
.day-nav + .c-go { margin-left: 0; }
#card-plan .c-body { touch-action: pan-y; }
.c-go { margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--faint); font-size: 18px; flex: none; }
.c-go:active { background: var(--sky-soft); }
.c-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.c-body > * { flex-shrink: 0; }
.empty { color: var(--faint); padding: 6px 0; }
.more { color: var(--muted); font-size: 14px; padding-top: 4px; flex: none; }
.more:empty { display: none; }
.fit { list-style: none; margin: 0; padding: 0; }

/* 가족 일정 */
.pg { display: grid; grid-template-columns: 30px repeat(var(--n), minmax(0, 1fr)); gap: 5px 6px; align-items: stretch; padding: 4px 3px 3px; }
.pg .slot .e.two { font-size: 24px; letter-spacing: -2px; }
.pg .who { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pg .who img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--sky-soft); box-shadow: 0 0 0 3px var(--mc); }
.pg .who b { font-size: 13px; color: var(--mc); line-height: 1.1; white-space: nowrap; }
.pg .half { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; line-height: 1; border-radius: 12px; }
.pg .half small { font-size: 10px; color: var(--faint); margin-top: 3px; font-weight: 600; }
.pg .half.now { background: #FFF1B8; }
.pg .half.now small { color: #8A6A00; }
.pg .slot {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 4px 3px 3px; border-radius: 14px;
  background: color-mix(in srgb, var(--mc) 13%, white); border: 2px solid transparent;
}
.pg .slot.now { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 22%, white); }
.pg .slot .e { font-size: 28px; line-height: 1.05; }
.pg .slot .t { font-size: 11px; line-height: 1.2; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.pg .slot.home { background: transparent; border: 2px dashed var(--line); }
.pg .slot.home .e { opacity: .45; font-size: 24px; }
.pg .slot.home.now { border-color: color-mix(in srgb, var(--mc) 60%, white); }
.plan-off { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.plan-off span { font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #FFF1B8; color: #8A6A00; }
.ttb { display: flex; align-items: stretch; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.ttb .tt-who { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30px; }
.ttb .tt-who img { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px #B89000; }
.ttb .tt-who small { font-size: 9px; font-weight: 700; color: #B89000; margin-top: 2px; }
.ttb .per { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 3px 1px; border-radius: 10px; background: #FFF6D6; border: 2px solid transparent; }
.ttb .per .n { font-size: 10px; font-weight: 700; color: #B89000; line-height: 1; }
.ttb .per .e { font-size: 20px; line-height: 1.15; }
.ttb .per .t { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ttb .per.opt { opacity: .5; border-style: dashed; border-color: #E5D08A; }
.ttb .per.past { opacity: .4; }
.ttb .per.now { border-color: #B89000; background: #FFE98A; }
.ttb .end { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 4px; font-size: 12px; font-weight: 700; color: var(--deep); }
.ttb .end .e { font-size: 18px; }
.plan-day { display: inline-block; font: 400 15px/1 var(--font-display); padding: 4px 10px; border-radius: 99px; background: var(--sky-soft); color: var(--deep); }
.plan-day.tomorrow { background: #EDE4FF; color: #6A4BC4; }

/* 캘린더 */
.ev-day { font-size: 13px; font-weight: 600; color: var(--muted); padding: 6px 0 2px; }
.ev-day.today { color: var(--c-cal); }
.ev-day:first-child { padding-top: 0; }
.ev { display: flex; gap: 10px; align-items: baseline; padding: 3px 0 3px 10px; border-left: 4px solid var(--ec); margin: 2px 0; font-size: 16px; line-height: 1.3; }
.ev .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 42px; flex: none; }
.ev .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 할 일 */
.todo { display: flex; align-items: center; gap: 10px; padding: 5px 0; transition: opacity .3s; }
.todo + .todo { border-top: 1px solid var(--line); }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--c-todo); flex: none; display: grid; place-items: center; }
.tick i { width: 12px; height: 7px; border: solid #fff; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.todo.done .tick { background: var(--c-todo); }
.todo.done .tick i { opacity: 1; }
.todo.done .tx { text-decoration: line-through; color: var(--faint); }
.todo .tx { flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; }
.todo .hot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #E8686B; margin-right: 6px; vertical-align: 2px; }
.who { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--wc); vertical-align: 1px; }
.due { font-size: 13px; color: var(--muted); flex: none; }
.due.late { color: var(--late); font-weight: 600; }
.due.today { color: var(--c-todo); font-weight: 600; }

/* 오늘 메뉴: 우리가족 앱의 '오늘 점심/저녁' 상자와 같은 모양 (+ 빨리 먹을 것 한 줄) */
.dinner-box {
  flex: 0 1 300px; min-width: 0; align-self: center; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px;
  background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); color: inherit; text-decoration: none;
}
.dinner-box .ico { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #FDF1DC; color: #C27A00; }
.dinner-box .ico svg { width: 22px; height: 22px; }
.dinner-box .txt { flex: 1; min-width: 0; display: grid; }
.dinner-box .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.dinner-box .menu { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.dinner-box .menu.none { color: var(--muted); font-weight: 500; font-size: 15px; }
.dinner-box .soon { font-size: 12px; color: var(--late); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid-tag { display: inline-block; margin: 0 4px 0 2px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #E2F2E4; color: #2E7A44; vertical-align: 2px; }

/* 아이들 */
.kid { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 6px 0; }
.kid + .kid { border-top: 1px solid var(--line); }
.kid img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--mc); }
.kid .nm { font: 400 19px/1.2 var(--font-display); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kid .nm small { font: 500 14px var(--font-body); color: var(--muted); }
.bar { height: 14px; border-radius: 99px; background: var(--sky-soft); overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #FFD54A, #FFB300); }
.kid .rw { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.money { font-size: 14px; font-weight: 600; color: var(--ok); }

/* 로그인 */
.gate { grid-column: 1 / -1; text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.gate img { width: 96px; height: 96px; border-radius: 24px; }
.gate h1 { font: 400 30px var(--font-display); margin: 0; }
.gate p { margin: 0; color: var(--muted); max-width: 440px; }
.btn { padding: 12px 22px; border-radius: 14px; background: var(--deep); color: #fff; font-weight: 600; }
.input { padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; text-align: center; letter-spacing: .1em; }
.err { color: var(--late); }
.link-btn { color: var(--muted); text-decoration: underline; font-size: 14px; }

/* 알림 */
/* 🎒 준비물 팝업 (아침 7시, 또는 🎒 버튼) */
.tool.pack { position: relative; }
.tool.pack i { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E85D75; color: #fff; font: 700 11px/18px var(--font-body); font-style: normal; }
#pack { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(18, 50, 74, .45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
#pack[hidden] { display: none; }
.pk-card { width: min(92vw, 980px); max-height: 92vh; overflow: auto; background: #FFFDF6; border-radius: 32px; padding: 26px 30px 24px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); animation: pk-in .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pk-in { from { transform: translateY(30px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.pk-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.pk-top .bag { font-size: 56px; line-height: 1; animation: swing 2.4s ease-in-out infinite; transform-origin: 50% 10%; }
.pk-top h2 { margin: 0; font: 400 38px/1.1 var(--font-display); }
.pk-top small { display: block; font: 500 16px var(--font-body); color: var(--muted); margin-top: 4px; }
.pk-top .x { margin-left: auto; width: 48px; height: 48px; border-radius: 50%; background: var(--bg); font-size: 22px; color: var(--muted); }
.pk-empty { width: min(92vw, 560px); text-align: center; }
.pk-none { font: 400 26px var(--font-display); margin: 10px 0 6px; }
.pk-hint { color: var(--muted); font-size: 15px; margin: 0 0 6px; }
.pk-people { display: flex; flex-wrap: wrap; gap: 14px; }
.pk-who { flex: 1 1 260px; min-width: 0; border-radius: 24px; padding: 14px; background: color-mix(in srgb, var(--mc) 12%, white); }
.pk-who .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pk-who .hd img { width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 0 0 3px var(--mc); background: #fff; }
.pk-who .hd b { font: 400 26px/1 var(--font-display); color: var(--mc); }
.pk-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.pk-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px; border-radius: 20px; background: #fff; border: 3px solid transparent; box-shadow: 0 6px 14px -10px rgba(0,0,0,.35); transition: transform .15s; }
.pk-item:active { transform: scale(.95); }
.pk-item .e { font-size: 50px; line-height: 1.05; }
.pk-item .t { font: 400 18px/1.2 var(--font-display); text-align: center; overflow-wrap: anywhere; }
.pk-item.done { border-color: #4CBE8C; background: #EAF8F0; }
.pk-item.done .e { opacity: .45; }
.pk-item.done::after { content: '✓'; position: absolute; top: 6px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: #4CBE8C; color: #fff; font: 700 19px/30px var(--font-body); text-align: center; animation: pop .3s; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.pk-bottom { display: flex; justify-content: center; margin-top: 20px; }
.pk-bottom button { padding: 16px 34px; border-radius: 22px; background: #4CBE8C; color: #fff; font: 400 24px/1 var(--font-display); box-shadow: 0 10px 22px -12px rgba(30,120,80,.8); }
.pk-yay { position: fixed; inset: 0; z-index: 41; pointer-events: none; overflow: hidden; }
.pk-yay i { position: absolute; top: -40px; font-size: 34px; font-style: normal; animation: yay 2.4s ease-in forwards; }
@keyframes yay { to { transform: translateY(110vh) rotate(540deg); } }
/* 💡 화면 켜 두기 설정 창 */
#wake { position: fixed; inset: 0; z-index: 42; display: flex; align-items: flex-start; justify-content: flex-end; padding: 150px 24px 0 0; background: rgba(18,50,74,.25); }
#wake[hidden] { display: none; }
.wk-card { width: 380px; max-width: 92vw; background: #FFFDF6; border-radius: 26px; padding: 18px 20px 16px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.45); animation: pk-in .35s cubic-bezier(.2,1.4,.4,1); }
.wk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.wk-head .ic { font-size: 30px; }
.wk-head b { font: 400 24px/1 var(--font-display); }
.wk-head .x { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 18px; }
.wk-seg { display: flex; gap: 6px; background: var(--bg); padding: 5px; border-radius: 16px; }
.wk-seg button { flex: 1; padding: 11px 6px; border-radius: 12px; font-weight: 600; font-size: 15px; color: var(--muted); }
.wk-seg button[aria-pressed="true"] { background: var(--deep); color: #fff; }
.wk-time { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 16px; font-weight: 600; }
.wk-time input { font: 600 22px/1 var(--font-body); padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font-variant-numeric: tabular-nums; }
.wk-now { margin: 14px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.wk-now.on { color: var(--ok); }
.wk-note { margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
/* ⭐ 칭찬 스티커판 */
.kid.tap { cursor: pointer; border-radius: 16px; transition: background .15s; }
.kid.tap:active { background: rgba(255,255,255,.6); }
#stk { position: fixed; inset: 0; z-index: 43; display: grid; place-items: center; background: rgba(18,50,74,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
#stk[hidden] { display: none; }
.stk-card { position: relative; width: min(92vw, 860px); max-height: 92vh; overflow: auto; background: #FFFDF6; border-radius: 32px; padding: 20px 26px 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); animation: pk-in .45s cubic-bezier(.2,1.4,.4,1); }
.stk-card.k-davin { background: linear-gradient(#FFF8D6, #FFFDF6 40%); }
.stk-card.k-arin { background: linear-gradient(#FBE9FF, #FFFDF6 40%); }
.stk-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.stk-tabs { display: flex; gap: 8px; }
.stk-tabs button { display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 5px; border-radius: 99px; font: 400 22px/1 var(--font-display); color: var(--mc); background: #fff; border: 3px solid transparent; opacity: .55; }
.stk-tabs button[aria-pressed="true"] { opacity: 1; border-color: var(--mc); }
.stk-tabs img { width: 46px; height: 46px; border-radius: 50%; }
.stk-rw { flex: 1; min-width: 0; display: flex; flex-direction: column; font: 400 20px/1.25 var(--font-display); }
.stk-rw small { font: 500 14px var(--font-body); color: var(--muted); }
.stk-top .x { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--muted); font-size: 20px; flex: none; }
.big-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 14px; }
.big-row .big { width: 74px; height: 74px; display: grid; place-items: center; font-size: 34px; border-radius: 50%; border: 3px dashed #E8D9A0; filter: grayscale(1); opacity: .45; }
.big-row .big.full { border: 0; filter: none; opacity: 1; }
.big-row .big.full svg { width: 100%; height: 100%; }
.big-row .big.pop svg { animation: stk-pop 1s cubic-bezier(.2,1.6,.4,1); }
.big-row .big-gift { font-size: 44px; opacity: .35; filter: grayscale(1); }
.big-row .big-gift.ready { opacity: 1; filter: none; animation: swing 1.6s ease-in-out infinite; }
.board-grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; max-width: 640px; margin: 0 auto; }
.board-grid .slot { aspect-ratio: 1; border-radius: 22px; border: 3px dashed #E2D7F0; display: grid; place-items: center; font: 400 24px var(--font-display); color: #CFC3E0; background: rgba(255,255,255,.7); }
.board-grid .slot.full { border: 0; background: #fff; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); padding: 6px; }
.board-grid .slot.full svg { width: 100%; height: 100%; }
.board-grid .slot.pop { animation: stk-pop .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes stk-pop { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
.wig { animation: wiggle .6s ease-in-out; }
.stk-board .cnt { text-align: center; font: 400 22px var(--font-display); color: #8A6A00; margin: 12px 0 4px; }
.stk-btn { display: block; margin: 10px auto 0; padding: 16px 34px; border-radius: 22px; background: #FFC928; color: #5A4300; font: 400 24px/1 var(--font-display); box-shadow: 0 10px 22px -12px rgba(160,110,0,.8); }
.k-arin .stk-btn { background: #FF8AB3; color: #fff; }
.done-banner { text-align: center; padding: 18px; border-radius: 24px; background: #FFF1B8; font: 400 22px/1.4 var(--font-display); }
.ms-mini { display: flex; align-items: center; gap: 3px; margin-top: 2px; }
.ms-mini span { font-size: 18px; line-height: 1; filter: grayscale(1); opacity: .35; }
.ms-mini span.on { filter: none; opacity: 1; }
.ms-mini b { margin-left: 6px; font: 600 13px var(--font-body); color: var(--muted); }
.ms-mini b.ready { font-size: 18px; animation: swing 1.4s ease-in-out infinite; }
.ms-mini b.got { font-size: 15px; }
.ms-box { background: rgba(255,255,255,.75); border-radius: 24px; padding: 12px 14px 14px; margin-bottom: 14px; }
.ms-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.ms-h b { font: 400 22px var(--font-display); }
.ms-h span { font: 400 20px var(--font-display); color: #8A6A00; }
.ms-tiles { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 10px; }
.ms-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 10px; border-radius: 20px; background: #fff; border: 3px solid #EDE4D0; box-shadow: 0 6px 14px -10px rgba(0,0,0,.35); }
.ms-tile .e { font-size: 44px; line-height: 1.05; }
.ms-tile .t { font: 400 16px/1.2 var(--font-display); text-align: center; }
.ms-tile.done { border-color: #4CBE8C; background: #EAF8F0; }
.ms-tile.done::after { content: '✓'; position: absolute; top: 6px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: #4CBE8C; color: #fff; font: 700 18px/28px var(--font-body); text-align: center; animation: pop .3s; }
.ms-claim { margin-top: 12px; animation: bob 1.6s ease-in-out infinite; }
.ms-got { margin-top: 10px; text-align: center; font: 400 18px var(--font-display); color: var(--ok); }
.kline { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.wk-mini { display: inline-flex; gap: 3px; font-size: 16px; }
.nm b.gold { font: 600 13px var(--font-body); color: #B07A00; white-space: nowrap; }
.nm b.gold.ready { font-size: 18px; animation: swing 1.4s ease-in-out infinite; }
.ms-badge { margin-left: auto; font: 600 13px var(--font-body); color: var(--muted); white-space: nowrap; }
.ms-badge.ready { font-size: 20px; animation: swing 1.4s ease-in-out infinite; }
.ms-badge.got { font-size: 16px; }
.wk-mini i { width: 21px; height: 21px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--mc) 45%, white); display: inline-block; }
.wk-mini i svg { width: 100%; height: 100%; display: block; }
.wk-mini i.got { border: 0; }
.wk-mini i.today { border-style: solid; border-color: var(--mc); }
.wk-mini i.missed { opacity: .35; }
.wk-mini b.gold { margin-left: 6px; font: 600 13px var(--font-body); color: #B07A00; white-space: nowrap; }
.wk-mini b.gold.ready { font-size: 18px; animation: swing 1.4s ease-in-out infinite; }
.wk-h { display: flex; align-items: center; gap: 12px; margin: 4px 4px 10px; }
.wk-h b { font: 400 22px var(--font-display); }
.wk-h span { font: 400 22px var(--font-display); color: #8A6A00; }
.wk-h .gift { margin-left: auto; font-size: 40px; opacity: .35; filter: grayscale(1); }
.wk-h .gift.ready { opacity: 1; filter: none; animation: swing 1.4s ease-in-out infinite; }
.wk-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.wk-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 24px; background: rgba(255,255,255,.7); border: 3px dashed #E2D7F0; }
.wk-slot .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; font-size: 30px; color: #CFC3E0; }
.wk-slot .pic svg { width: 100%; height: 100%; }
.wk-slot .day { font: 400 20px/1 var(--font-display); color: #8B7AA8; }
.wk-slot.got { background: #fff; border: 3px solid transparent; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); }
.k-davin .wk-slot.today { border: 3px solid #FFC928; background: #FFF6D0; }
.k-arin .wk-slot.today { border: 3px solid #FF8AB3; background: #FFEAF3; }
.wk-slot.today .pic { color: #FFC928; animation: bob 1.6s ease-in-out infinite; }
.wk-slot.missed { opacity: .45; }
.wk-slot.off { opacity: 1; border: 3px solid #9CCBEA; background: #E8F4FD; }
.wk-off-hint { text-align: center; margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.wk-slot.pop .pic { animation: stk-pop .6s cubic-bezier(.2,1.6,.4,1); }
.wk-note { text-align: center; margin: 14px 0 0; font: 400 18px var(--font-display); color: var(--muted); }
#stk-gift { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(18,50,74,.35); }
#stk-gift[hidden] { display: none; }
.gift-pop { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 40px 22px; border-radius: 32px; background: #FFFDF6; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); animation: pk-in .45s cubic-bezier(.2,1.4,.4,1); }
.gift-pop b { font: 400 28px var(--font-display); }
.gift-pop .gift { width: 200px; height: 200px; animation: bob 1.6s ease-in-out infinite; }
.gift-pop .gift svg, .gift-pop .reveal svg { width: 100%; height: 100%; }
.gift-pop .reveal { width: 210px; height: 210px; animation: stk-pop .7s cubic-bezier(.2,1.6,.4,1); }
.gift-pop .taps { display: flex; gap: 10px; }
.gift-pop .taps i { width: 16px; height: 16px; border-radius: 50%; background: #E2D7F0; }
.gift-pop .taps i.on { background: #FFC928; }
.gift-pop .hint { font: 400 20px var(--font-display); color: var(--muted); }
#stk-pin { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,50,74,.35); }
#stk-pin[hidden] { display: none; }
.pin-card { background: #fff; border-radius: 28px; padding: 22px 26px; text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
.pin-card b { font: 400 22px var(--font-display); }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--deep); }
.pin-dots i.on { background: var(--deep); }
.pin-dots.shake { animation: wiggle .35s; }
.pin-err { color: var(--late); font-size: 14px; margin: 0 0 6px; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; justify-content: center; margin-top: 8px; }
.pin-pad button { height: 56px; border-radius: 16px; background: var(--bg); font: 600 22px var(--font-body); }
#toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  background: #12324A; color: #fff; padding: 12px 18px; border-radius: 14px; display: flex; gap: 16px; align-items: center; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
}
#toast button { color: #8CCFFF; font-weight: 700; }

/* 가로 화면 고정: 3×2 카드가 화면 하나에 딱 맞음. 세로로 들면 "가로로 돌려 주세요" */
#app { height: 100vh; min-height: 0; position: fixed; left: 0; top: 0; transform-origin: 0 0; }
body { overflow: hidden; }
#grid { flex: 1; min-height: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1.75fr) minmax(0, 1fr);
  grid-template-areas: "plan cal todo" "kids cal todo"; }
#card-plan { grid-area: plan; } #card-cal { grid-area: cal; } #card-todo { grid-area: todo; } #card-kids { grid-area: kids; }
#rotate { display: none; }
@media (orientation: portrait) {
  #app { display: none; }
  #rotate { display: flex; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #rotate .ic { font-size: 72px; animation: turn 2.4s ease-in-out infinite; }
  #rotate p { margin: 0; font: 400 26px/1.4 var(--font-display); }
  #rotate small { color: var(--muted); font-size: 16px; }
}
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

/* ═══ 배치 다듬기: 위 줄 높이·가장자리 맞추기, 일정 카드는 왼쪽 한 줄 전체, 글자 조금 크게 ═══ */
#top { flex-wrap: nowrap; height: 156px; }
.clockbox { flex: none; width: 250px; padding: 0 4px; }
.weather { flex: 1 1 0; }
.side { flex: none; width: 300px; display: flex; flex-direction: column; gap: 10px; }
.side .dinner-box { flex: 1; align-self: stretch; }
.side .tools { flex-direction: row; justify-content: flex-end; gap: 8px; }
.side .tool { width: 46px; height: 40px; }
#grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, .62fr) minmax(0, 1.12fr); grid-template-rows: minmax(0, 1fr) 342px;
  grid-template-areas: "plan cal todo" "plan cal kids"; }
.card { padding: 16px 18px 14px; border-radius: 24px; }
.c-head { margin-bottom: 12px; }
.c-title { font-size: 22px; }
/* 가족 일정: 칸이 넓어진 만큼 그림 크게 */
.pg { gap: 8px 8px; }
.pg .who img { width: 50px; height: 50px; }
.pg .who b { font-size: 14px; }
.pg .slot { padding: 10px 4px 7px; border-radius: 16px; }
.pg .slot .e { font-size: 38px; }
.pg .slot .t { font-size: 12px; margin-top: 4px; }
.pg .slot.home .e { font-size: 30px; }
.pg .half { font-size: 28px; }
.ttb { margin-top: 12px; padding-top: 12px; gap: 5px; }
.ttb .tt-who { width: 36px; }
.ttb .tt-who img { width: 32px; height: 32px; }
.ttb .per { padding: 5px 1px 4px; border-radius: 12px; }
.ttb .per .e { font-size: 24px; }
.ttb .per .t { font-size: 11px; }
.pkr { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.pkr .pk-ic { font-size: 22px; margin-right: 2px; }
.pkr button { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 4px; border-radius: 99px; font-size: 15px; font-weight: 600; background: color-mix(in srgb, var(--mc) 14%, white); }
.pkr button img { width: 24px; height: 24px; border-radius: 50%; }
.pkr button .e { font-size: 18px; }
.pkr button.done { opacity: .45; text-decoration: line-through; }
/* 이번 주 일정 · 할 일: 글자 크게, 줄 간격 넉넉하게 */
.ev-day { font-size: 14px; font-weight: 700; padding: 10px 0 4px; }
.ev-day.today { color: var(--c-cal); }
.ev { font-size: 17px; padding: 5px 0 5px 12px; margin: 3px 0; border-left-width: 5px; border-radius: 2px; }
.ev .tm { font-size: 15px; min-width: 48px; }
.todo { padding: 8px 0; gap: 12px; }
.todo .tx { font-size: 17px; }
.due { font-size: 14px; }
.kid { padding: 8px 0; }

/* ═══════════ 사계절 창문: 화면 전체 계절 배경 + 반투명 카드 ═══════════ */

/* ── 1. 사계절 창문: 화면 전체가 계절 풍경, 카드는 반투명 유리 ── */
#bg { display: none; }
.theme-glass #bg { display: block; position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.theme-glass #bg .land { position: absolute; left: 0; bottom: 0; width: 100%; height: 46%; }
.theme-glass #bg .cloud { position: absolute; opacity: .9; animation: drift ease-in-out infinite alternate; }
.theme-glass #bg .cloud svg { width: 100%; display: block; }
.theme-glass #bg .sun { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(#FFE27A 55%, #FFC928 56%); box-shadow: 0 0 0 18px rgba(255,214,79,.22), 0 0 80px rgba(255,200,40,.6); animation: glow 4s ease-in-out infinite; transition: left 60s linear, top 60s linear; }
.theme-glass #bg .sun.low { background: radial-gradient(#FFB36B 55%, #FF8A4C 56%); box-shadow: 0 0 0 18px rgba(255,150,80,.22), 0 0 90px rgba(255,120,60,.6); }

  function missionGift(k) {

  function giveSticker(k, d) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), day = todayKey();
    const st = { at: Date.now(), d, why: '@mission', by: (S.user && S.user.uid) || 'dashboard' };

  // 카드 칸에 다 안 들어가는 줄은 뒤에서부터 접고 "+N개 더"로 (캘린더는 날짜 머리만 남지 않게)
  function fitCards() {
    for (const body of document.querySelectorAll('.c-body')) {
      const list = $('.fit', body), more = $('.more', body);
      if (!list || !more) continue;
      let hidden = 0;
      more.textContent = '';
      if (body.scrollHeight <= body.clientHeight + 1) continue;
      more.textContent = L().more(9); // "+N개 더" 줄 자리도 미리 잡아 둠
      while (body.scrollHeight > body.clientHeight + 1 && list.children.length > 1) {
        const last = list.lastElementChild;
        if (!last.classList.contains('ev-day')) hidden++;
        last.remove();
        while (list.lastElementChild && list.lastElementChild.classList.contains('ev-day')) list.lastElementChild.remove();
      }
      more.textContent = hidden ? L().more(hidden) : '';
    }
  }

  /* 화면 켜 두기 (집에 세워 둔 패드용) */
  // 설정: { mode: 'off' | 'all' | 'time', from: '06:30', to: '21:30' } (예전 true/false 도 읽음)
  let wakeCfg = (() => {
    const v = load('family-home:wake', null);
    if (v && typeof v === 'object') return { mode: 'off', from: '06:30', to: '21:30', ...v };
    return { mode: v === true ? 'all' : 'off', from: '06:30', to: '21:30' };
  })();
  let wakeLock = null, wakeMsg = '';
  const toMin = (t) => { const [a, b] = String(t || '0:0').split(':').map(Number); return a * 60 + (b || 0); };
  function wakeWanted() {
    if (wakeCfg.mode === 'all') return true;
    if (wakeCfg.mode !== 'time') return false;
    const n = new Date().getHours() * 60 + new Date().getMinutes(), a = toMin(wakeCfg.from), b = toMin(wakeCfg.to);
    return a <= b ? n >= a && n < b : n >= a || n < b; // 밤을 넘기는 시간(예: 20시–7시)도 됨
  }
  const wakeOn = () => wakeWanted();
  async function applyWake() {
    try {
      const want = wakeWanted();
      if (want && document.visibilityState === 'visible') {
        if (!('wakeLock' in navigator)) { wakeMsg = L().wakeNo; return; }
        if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { console.warn('wake', e); }
  }
  function saveWake() { store('family-home:wake', wakeCfg); wakeMsg = ''; applyWake().then(() => { if (wakeMsg) toast(wakeMsg); renderTop(); }); }
  function toggleWake() { openWake(); }
  // 쉬는 시간(밤 9시~아침 6시, 또는 💡 시간 정하기 바깥): 비·눈·구름·해 움직임을 멈추고 흐림(유리) 효과를 줄임 — 화면 모양은 그대로
  function applyCalm() {
    const hr = new Date().getHours();
    const calm = hr >= 21 || hr < 6 || (wakeCfg.mode === 'time' && !wakeWanted());
    document.body.classList.toggle('calm', calm);
  }
  function openWake() {
    const box = $('#wake');
    const close = () => { box.hidden = true; box.replaceChildren(); };
    const draw = () => {
      const seg = h('div', { class: 'wk-seg' }, ...[['off', L().wakeOff], ['all', L().wakeAll], ['time', L().wakeTime]].map(([m, label]) =>
        h('button', { type: 'button', 'aria-pressed': String(wakeCfg.mode === m), text: label, onclick: () => { wakeCfg.mode = m; saveWake(); draw(); } })));
      const time = (k) => h('input', { type: 'time', value: wakeCfg[k], 'aria-label': k === 'from' ? L().wakeFrom : L().wakeTo,
        onchange: (e) => { if (e.target.value) { wakeCfg[k] = e.target.value; saveWake(); draw(); } } });
      const now = wakeWanted();
      box.replaceChildren(h('div', { class: 'wk-card', role: 'dialog', 'aria-modal': 'true' },
        h('div', { class: 'wk-head' }, h('span', { class: 'ic', text: '💡' }), h('b', { text: L().wake }),
          h('button', { type: 'button', class: 'x', 'aria-label': '✕', text: '✕', onclick: close })),
        seg,
        wakeCfg.mode === 'time' ? h('div', { class: 'wk-time' }, time('from'), h('span', { text: L().wakeFromTo }), time('to'), h('span', { text: L().wakeUntil })) : null,
        h('p', { class: 'wk-now' + (now ? ' on' : ''), text: now ? L().wakeNowOn : L().wakeNowOff }),
        h('p', { class: 'wk-note', text: L().wakeNote })));
    };
    draw();
    box.hidden = false;

  async function startFirebase() {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg) { S.ready = true; render(); return; }
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
      const app = initializeApp(cfg);
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { console.warn('cache', e); db = F.getFirestore(app); }
      fb = { A, F, auth: A.getAuth(app), db };
      A.onAuthStateChanged(fb.auth, async (user) => {
        S.user = user; S.house = null; S.err = '';
        if (user) {
          try {
            const u = await F.getDoc(F.doc(fb.db, 'users', user.uid));
            S.house = (u.exists() && u.data().house) || null;
            store(HOUSE_KEY, { uid: user.uid, house: S.house });
          } catch (e) {
            console.warn('house', e);
            const c = load(HOUSE_KEY, null);
            if (c && c.uid === user.uid) S.house = c.house;
          }
        } else {
          // 로그아웃: 이 기기에 저장한 가족 자료 지우기
          fam = null; store(FAM_KEY, null); cal = { events: [], calendars: [], at: 0 }; store(EV_KEY, null); store(HOUSE_KEY, null);
        }
        S.ready = true;
        listenFamily();
        render();

    } catch (e) {
      console.warn('firebase', e);
      S.ready = true; S.err = L().loadErr; render();
    }
  }

  async function demoApi(path) {
    await new Promise((r) => setTimeout(r, 200));
    if (path === '/events') return { events: cal.events, calendars: cal.calendars, accounts: [{ main: true }] };
    return {};
  }

  /* ───────── 시작 ───────── */
  // 화면은 1180×820(아이패드 가로) 기준으로 짜 두고, 기기 화면에 맞게 통째로 확대·축소 (작은 패드에서 카드가 잘리지 않게)
  function fitZoom() {
    const app = $('#app'), z = Math.min(innerWidth / 1180, innerHeight / 820);
    // CSS zoom 은 브라우저마다 길이를 두 번 곱하기도 해서, 크기는 그대로 두고 그림처럼 확대·축소(transform)
    app.style.width = `${innerWidth / z}px`;
    app.style.height = `${innerHeight / z}px`;
    app.style.transform = `scale(${z})`;
  }
  fitZoom();
  // 아이패드 사파리는 user-scalable=no 를 무시하기도 해서 두 손가락 확대를 따로 막음 (우리가족 앱과 같음)
  for (const type of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // 두 번 터치 확대는 CSS touch-action 으로 막음 (선물 상자 톡톡톡처럼 빠른 터치는 그대로 됨)
  if (DEMO) { demoSetup(); S.ready = true; window.__kid = { kidSVG, girlSVG, adultSVG, dressFor, personIcon }; }
  render();
  // 글꼴이 늦게 오면 줄 높이가 바뀌므로 카드 칸 맞춤을 다시
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderGrid());
  if (!DEMO) startFirebase();
  loadHolidays();
  loadWeather();
  applyWake();
  // 시계: 10초마다 / 날짜가 바뀌거나 정시마다 전체 새로 (일정 카드가 오늘→내일로 넘어가는 등)
  let lastStamp = `${todayKey()} ${new Date().getHours()}`;
  setInterval(() => {
    const now = new Date();
    const c = $('#clock'); if (c) c.textContent = hhmm(now);
    const stamp = `${todayKey()} ${now.getHours()}`;
    if (stamp !== lastStamp) {
      const newDay = stamp.slice(0, 10) !== lastStamp.slice(0, 10);
      lastStamp = stamp; render();
      if (newDay) { loadEvents(); loadHolidays(); }
    }
    safely('pack', packMorning);
    safely('calm', applyCalm);
    safely('bg', renderBg);
    if (wakeCfg.mode === 'time' && !!wakeLock !== wakeWanted()) applyWake().then(renderTop);
  }, 10000);
  // 캘린더 10분마다, 날씨 30분마다 (화면이 켜져 있을 때만)
  setInterval(() => { if (document.visibilityState === 'visible') loadEvents(); }, 10 * 60e3);
  setInterval(() => { if (document.visibilityState === 'visible') loadWeather(); }, 30 * 60e3);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    applyWake(); render();
    if (Date.now() - (cal.at || 0) > 5 * 60e3) loadEvents();
    loadWeather();
  });
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fitZoom(); renderGrid(); }, 150); });
  if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
})();
</script>
</body>
</html>
